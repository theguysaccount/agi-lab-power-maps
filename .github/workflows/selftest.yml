# Weekly self-test of the live companion (pages, verbatim lab data, indexing, freshness: dispatches weekly.yml when the
# link check is stale), a headless end-to-end run, then the keep-alive.
name: Self-test

on:
  schedule:
    - cron: "17 7 * * 4"     # Thursdays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Live pages, data, indexing and freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/health.py "$SITE_URL"
      - name: Live end-to-end run
        run: scripts/e2e.sh "$SITE_URL/"

  keepalive:
    needs: live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/keepalive.sh
